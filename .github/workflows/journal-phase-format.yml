name: Temporary Journal branch Rust formatting
on:
  push:
    branches:
      - feat/journal-phase-2-3-complete
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/journal-phase-2-3-complete
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Rust formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(journal): apply rustfmt"
          git push origin HEAD:feat/journal-phase-2-3-complete
