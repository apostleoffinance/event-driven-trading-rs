name: Cloudflare Frontend Build

on:
  push:
    branches:
      - main
      - feat/cloudflare-workers-frontend
    paths:
      - "frontend/**"
      - ".github/workflows/cloudflare-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/cloudflare-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cloudflare-frontend:
    name: Next.js + OpenNext Workers build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Commit regenerated frontend lockfile to PR branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(frontend): refresh package lockfile"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PR_BRANCH}"
          fi
      - name: Upload regenerated lockfile (temporary CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          retention-days: 1
      - name: Typecheck
        run: npm run typecheck
      - name: Build Cloudflare Worker
        run: npm run cloudflare:build
