name: Cloudflare Frontend Build

on:
  push:
    branches:
      - main
      - feat/cloudflare-workers-frontend
    paths:
      - "frontend/**"
      - ".github/workflows/cloudflare-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/cloudflare-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-frontend:
    name: Next.js + OpenNext Workers build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build Cloudflare Worker
        run: npm run cloudflare:build
