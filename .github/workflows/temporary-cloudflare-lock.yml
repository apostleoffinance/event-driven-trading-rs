name: Temporary Cloudflare provider lockfile
on:
  push:
    branches:
      - feat/identity-hardening-jwks-mfa-frontend
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
      - run: terraform -chdir=infra/cloudflare init -backend=false
      - name: Commit Terraform provider lock
        run: |
          if [ ! -f infra/cloudflare/.terraform.lock.hcl ]; then echo "Terraform lockfile missing"; exit 1; fi
          git add -f infra/cloudflare/.terraform.lock.hcl
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pin Cloudflare Terraform provider"
          git pull --rebase origin feat/identity-hardening-jwks-mfa-frontend
          git push
