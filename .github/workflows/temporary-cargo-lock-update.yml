name: Temporary Cargo lockfile updater
on:
  push:
    branches:
      - feat/identity-hardening-jwks-mfa-frontend
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo check --workspace
      - name: Commit Cargo.lock
        run: |
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Update Cargo.lock for identity security dependencies"
          git pull --rebase origin feat/identity-hardening-jwks-mfa-frontend
          git push
