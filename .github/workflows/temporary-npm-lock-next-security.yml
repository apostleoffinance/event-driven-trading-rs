name: Temporary npm lockfile updater for Next security patch
on:
  push:
    branches:
      - feat/identity-hardening-jwks-mfa-frontend
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update lockfile
        run: cd frontend && npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Update frontend lockfile for patched Next.js"
          git pull --rebase origin feat/identity-hardening-jwks-mfa-frontend
          git push
