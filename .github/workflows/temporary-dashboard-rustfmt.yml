name: Temporary dashboard Rust formatter

on:
  push:
    branches:
      - feat/dashboard-api-read-model

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dashboard-api-read-model
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/journal-api/src/dashboard.rs crates/journal-api/src/main.rs
          git commit -m "style: rustfmt dashboard API implementation [skip ci]"
          git push origin feat/dashboard-api-read-model
