name: Quant OS CI

# Never terminate an in-flight validation run because a newer commit was pushed.
# GitHub Actions can queue runs for the same PR ref; every commit keeps its own result.
# This is important for macOS hosted runners, where pre-setup cancellations produce
# a red required check with no executed step or diagnostic evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  # Use one validation run per change: PRs use pull_request, direct changes use push.
  # This avoids duplicating long macOS preflight work for branches with open PRs.
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, check, test, clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python for QOS-020 guard
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run QOS-020 guard negative tests
        run: python scripts/qos020/test_guard.py
      - name: Provision isolated QOS-020 PostgreSQL
        id: qos020
        run: python scripts/qos020/provision.py
      - name: Install Rust 1.99.1 with components
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Guard Rust workspace checks and SQLx tests
        run: >-
          python scripts/qos020/qos020_guard.py
          --manifest "${{ steps.qos020.outputs.manifest }}"
          --secrets-dir "${{ steps.qos020.outputs.secrets_dir }}"
          --lane integration-test
          --run-id "${{ steps.qos020.outputs.run_id }}"
          -- bash -euc 'cargo fmt --all -- --check && cargo check --workspace && cargo test --workspace --jobs 1 -- --test-threads=1 && cargo clippy --workspace --all-targets -- -D warnings'
      - name: Verify SQLx test databases were cleaned up
        run: >-
          python scripts/qos020/qos020_guard.py
          --manifest "${{ steps.qos020.outputs.manifest }}"
          --secrets-dir "${{ steps.qos020.outputs.secrets_dir }}"
          --lane integration-test
          --run-id "${{ steps.qos020.outputs.run_id }}"
          --verify-sqlx-cleanup

  mt5-registry-contracts:
    name: MT5 gateway and broker registry contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run registry contract tests
        run: python -m unittest discover -s scripts/mt5-registry -p 'test_*.py' -v

  mt5-python-adapter:
    name: MT5 Python adapter contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/mt5-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run read-only adapter contract tests
        run: python -m unittest discover -s tests -v

  traderos-migration:
    name: TraderOS migration tooling tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run migration transform tests
        run: python -m unittest discover -s scripts/traderos-migration -p 'test_*.py' -v

  workspace-release-preflight:
    name: Workspace release preflight tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test read-only workspace invariant preflight
        run: bash scripts/test_workspace_release_preflight.sh

  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  macos-developer-preflight:
    name: macOS portable MT5 adapter preflight
    # macos-14 was retired from GitHub Actions on 2026-11-02.
    # Use the supported macos-15 arm64 image; keep this version explicit so
    # image migrations are deliberate and visible in CI.
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Record runner diagnostics
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $(sw_vers -productVersion)"
          echo "Architecture: $(uname -m)"
          echo "GitHub Actions runner image: $ImageOS / $ImageVersion"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run macOS portable checks
        timeout-minutes: 3
        run: bash adapters/mt5-python/scripts/mt5-macos-preflight.sh --skip-rust

  windows-mt5-powershell-parse:
    name: Windows MT5 PowerShell syntax
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Parse deployment and evidence scripts
        shell: pwsh
        run: |
          $paths = @(
            "adapters/mt5-python/scripts/mt5-windows-deployment-preflight.ps1",
            "adapters/mt5-python/scripts/capture-demo-acceptance-manifest.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parser failed for $path"
            }
            Write-Host "PASS: $path"
          }

  windows-mt5-demo-release-bundle:
    name: Build managed Windows DEMO deployment bundle
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build Windows MT5 bridge daemon
        shell: pwsh
        run: cargo build --release -p intent-bridge --bin mt5-bridge-daemon
      - name: Build secret-free DEMO deployment bundle
        shell: pwsh
        run: >-
          python adapters/mt5-python/scripts/package_windows_demo_bundle.py
          --root .
          --daemon target/release/mt5-bridge-daemon.exe
          --output artifacts/edgenest-mt5-windows-demo.zip
      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: edgenest-mt5-windows-demo-${{ github.sha }}
          path: artifacts/edgenest-mt5-windows-demo.zip
          if-no-files-found: error
          retention-days: 14
