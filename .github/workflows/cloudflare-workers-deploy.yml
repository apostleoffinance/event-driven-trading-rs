name: Deploy EdgeNest Frontend to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/production-acceptance.mjs"
      - ".github/workflows/cloudflare-workers-deploy.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-edgenest-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        
      - name: Build Next.js app for Cloudflare
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run cloudflare:build

      - name: Verify Wrangler v4 and generated Worker entrypoint
        run: |
          node --version
          npx wrangler --version
          test -s .open-next/worker.js
          python3 -c "import json; c=json.load(open('wrangler.jsonc')); assert c['main'] == '.open-next/worker.js', c.get('main')"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production Worker routes
        run: |
          FRONTEND_URL="https://edgenest-frontend.edgenest.workers.dev"
          for route in / /login; do
            STATUS=""
            for attempt in $(seq 1 20); do
              STATUS=$(curl --silent --show-error --output /tmp/edgenest-response.html --write-out "%{http_code}" "${FRONTEND_URL}${route}" || true)
              if [ "${STATUS}" = "200" ]; then
                echo "Production Worker route ${route} returned HTTP 200"
                break
              fi
              sleep 3
            done
            if [ "${STATUS}" != "200" ]; then
              echo "Production Worker route ${route} failed with HTTP ${STATUS}"
              head -c 2000 /tmp/edgenest-response.html || true
              exit 1
            fi
          done

  production-acceptance:
    name: Production API and six-viewport acceptance
    runs-on: ubuntu-24.04
    needs: [deploy]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.deploy.result == 'success'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browser tooling
        run: |
          npm install --prefix frontend --no-save --package-lock=false playwright@1.56.1
          npx --prefix frontend playwright install --with-deps chromium

      - name: Verify production API and six responsive viewports
        env:
          FRONTEND_URL: https://edgenest-frontend.edgenest.workers.dev
          API_URL: https://edgenest-api.onrender.com
          ACCEPTANCE_ARTIFACT_DIR: artifacts/production-acceptance
        run: node scripts/production-acceptance.mjs

      - name: Upload production acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgenest-production-acceptance
          path: artifacts/production-acceptance/
          if-no-files-found: warn
          retention-days: 14
