name: Deploy EdgeNest Frontend to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/cloudflare-workers-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-edgenest-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app for Cloudflare
        run: npm run cloudflare:build

      - name: Verify Wrangler v4 and generated Worker entrypoint
        run: |
          node --version
          npx wrangler --version
          test -s .open-next/worker.js
          node -e "const c=require('./wrangler.jsonc'); if(c.main !== '.open-next/worker.js') throw new Error('Unexpected Worker entrypoint: '+c.main);"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
