name: Format M3 M4 implementation branch

on:
  push:
    branches:
      - feat/organization-workspace-m3-m4

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Rust formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: format M3 and M4 implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
