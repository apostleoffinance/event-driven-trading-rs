[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/events",
    "crates/strategy-runtime",
    "crates/risk-engine",
    "crates/account-engine",
    "crates/execution-engine",
    "crates/venue-connectors",
    "crates/persistence",
    "crates/trading-runtime",
    "crates/reconciliation",
    "crates/intent-bridge",
    "crates/event-trading",
    "strategies/mean-reversion",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rust_decimal = { version = "1.33", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "rust_decimal",
    "json",
    "migrate",
    "macros",
] }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
