[package]
name = "intent-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python strategy → Rust execution bridge (JSON TradeIntent ingest)"

[[bin]]
name = "intent-bridge"
path = "src/main.rs"

[[bin]]
name = "mt5-bridge-daemon"
path = "src/bin/mt5-bridge-daemon.rs"

[dependencies]
async-trait = { workspace = true }
account-engine = { path = "../account-engine" }
chrono = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
domain = { path = "../domain" }
events = { path = "../events" }
persistence = { path = "../persistence" }
rust_decimal = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trading-runtime = { path = "../trading-runtime" }
venue-connectors = { path = "../venue-connectors" }

[dev-dependencies]
rcgen = "0.13"
sqlx = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
